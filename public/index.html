<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vergi Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171219;
  --panel:#211a26;
  --panel-2:#261e2c;
  --line:#372e3f;
  --text:#f2eadf;
  --muted:#9b90bb;
  --gold:#e0a93b;
  --gold-ink:#1b1408;
  --green:#4fb373;
  --green-bg:#1e3629;
  --red:#e2696b;
  --red-bg:#3b2027;
  --amber:#e6b34f;
  --amber-bg:#3a2f18;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 60px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand{display:flex;gap:16px;align-items:flex-start;min-width:0}
.logo{width:58px;height:58px;flex:none}
.brand-text{min-width:0}
h1{
  margin:2px 0 0;font:800 38px/1.1 "Cinzel",Georgia,serif;letter-spacing:.05em;
  color:var(--gold);text-transform:uppercase;overflow-wrap:anywhere;
}
.sub{margin-top:14px;font-size:12px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  font:400 12px/1 "JetBrains Mono",ui-monospace,Menlo,monospace;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:9px 12px;border-radius:999px;white-space:nowrap;
}
.chip b{color:var(--gold);font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 14px;font-weight:600;font-size:13px;white-space:nowrap;
}
.btn:hover{border-color:#54485f}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
.lbl{font-size:11px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.val{margin-top:12px;font-size:34px;font-weight:700;line-height:1}
.val.green{color:var(--green)}
.val.red{color:var(--red)}
.bar{margin-top:14px;height:5px;border-radius:5px;background:#30273a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 16px}
.search{
  width:230px;max-width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:13px;
}
.search::placeholder{color:#7d7397}
.pill{
  cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;
}
.pill[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.spacer{flex:1}
.admin-tools{display:flex;flex-wrap:wrap;gap:8px}

/* table */
.table-wrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:780px}
th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);background:var(--panel-2);padding:14px 16px;border-bottom:1px solid var(--line);
}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.nick{font-weight:700}
td.owner{color:#d9d0e6}
td.date{font:400 13px "JetBrains Mono",ui-monospace,monospace;color:var(--muted)}
td.note{color:var(--muted);max-width:260px;overflow-wrap:anywhere}
.tag{display:inline-block;background:#33293b;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:500;color:#d9d0e6}
.tag.empty{color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.paid{background:var(--green-bg);color:var(--green)}
.badge.unpaid{background:var(--red-bg);color:var(--red)}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.empty-row{text-align:center;color:var(--muted);padding:38px 16px}
.acts{white-space:nowrap;text-align:right}
.icon{
  cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;
  width:32px;height:32px;margin-left:4px;font-size:14px;line-height:1;
}
.icon:hover{background:var(--panel-2);border-color:#54485f}
.icon.ok{color:var(--green)}

.banner{
  background:var(--amber-bg);color:var(--amber);border:1px solid #5a4820;border-radius:10px;
  padding:10px 14px;margin-bottom:16px;font-size:13px;
}

/* modal */
.modal{
  position:fixed;inset:0;background:rgba(8,5,10,.66);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:20;
}
.panel{
  width:min(440px,100%);max-height:92vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:22px;
  animation:pop .14s ease-out;
}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 6px;font:800 18px "Cinzel",Georgia,serif;letter-spacing:.04em;color:var(--gold)}
.intro{margin:0 0 14px;color:var(--muted)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
}
.err{min-height:18px;margin-top:10px;color:var(--red);font-size:13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  transition:.18s;z-index:30;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:28px}
  .logo{width:46px;height:46px}
  .top{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  .panel{animation:none}
  #toast{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#1d1712" stroke="#e0a93b" stroke-width="2"/>
        <circle cx="32" cy="32" r="23" fill="none" stroke="#e0a93b" stroke-width="1.2" stroke-dasharray="2 3.2"/>
        <path d="M32 17 L44 32 L32 47 L20 32 Z" fill="none" stroke="#e0a93b" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M32 25 L37 32 L32 39 L27 32 Z" fill="#e0a93b"/>
      </svg>
      <div class="brand-text">
        <h1 id="guildName">Lonca Adı</h1>
        <div class="sub" id="subtitle">Vergi Defteri</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div id="topActions"></div>
  </header>
  <hr>

  <div id="banner"></div>
  <section class="stats" id="stats" aria-label="Özet"></section>

  <section class="toolbar">
    <input class="search" id="q" type="search" placeholder="Nick, sahip veya discord ara..." aria-label="Ara">
    <button class="pill" data-f="all" aria-pressed="true">Tümü</button>
    <button class="pill" data-f="unpaid" aria-pressed="false">Ödemeyenler</button>
    <button class="pill" data-f="paid" aria-pressed="false">Ödeyenler</button>
    <span class="spacer"></span>
    <div class="admin-tools" id="adminTools"></div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nick</th><th>Sınıf</th><th>Sahip</th><th>Vergi</th><th>Son ödeme</th><th>Notlar</th><th id="thAct" hidden></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const fmtDate = (iso) => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
const periodName = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${parseInt(d, 10)} ${MONTHS[parseInt(m, 10) - 1]} ${y} Dönemi`;
};

const store = {
  get() { try { return sessionStorage.getItem("adm"); } catch { return null; } },
  set(v) { try { v ? sessionStorage.setItem("adm", v) : sessionStorage.removeItem("adm"); } catch {} }
};

const DEMO = {
  settings: { guildName: "Lonca Adı", subtitle: "Vergi Defteri" },
  period: { start: "2026-09-18", weeklyTax: "" },
  members: [
    { id: "1", nick: "Arven", class: "Savaşçı", owner: "kaan", discord: "kaan", status: "unpaid", lastPaid: "", note: "" },
    { id: "2", nick: "Bellona", class: "", owner: "Bellona", discord: "", status: "paid", lastPaid: "2026-09-18", note: "" },
    { id: "3", nick: "Corvus", class: "Büyücü", owner: "deniz", discord: "deniz", status: "pending", lastPaid: "2026-09-11", note: "Onay bekliyor" },
    { id: "4", nick: "Dravik", class: "", owner: "Dravik", discord: "", status: "unpaid", lastPaid: "", note: "" },
    { id: "5", nick: "Elowen", class: "Şifacı", owner: "ece", discord: "ece", status: "unpaid", lastPaid: "2026-09-11", note: "Cuma ödeyecek" }
  ]
};

let state = null, demo = false, filter = "all", query = "";
let token = store.get();
const isAdmin = () => !!token;

async function load() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error();
    state = await r.json();
    demo = false;
  } catch {
    if (!state) { state = DEMO; demo = true; }
  }
  render();
}

async function api(action, payload = {}) {
  const headers = { "content-type": "application/json" };
  if (token) headers.authorization = "Bearer " + token;
  const r = await fetch("/api/admin", { method: "POST", headers, body: JSON.stringify({ action, ...payload }) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && action !== "login") { logout(); throw new Error("Oturum süresi doldu, tekrar giriş yap."); }
  if (!r.ok) throw new Error(data.error || "Bir hata oluştu");
  return data;
}

/* ---------- render ---------- */
function statCard(label, value, cls, pct) {
  return h("div", { class: "stat" },
    h("div", { class: "lbl" }, label),
    h("div", { class: "val " + (cls || "") }, value),
    pct != null ? h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })) : null
  );
}

const badge = (status) =>
  status === "paid" ? h("span", { class: "badge paid" }, "✓ Ödendi")
  : status === "pending" ? h("span", { class: "badge pending" }, "⏳ Onay bekliyor")
  : h("span", { class: "badge unpaid" }, "✕ Ödenmedi");

function render() {
  const { settings: s, period: p, members } = state;
  document.title = `${s.guildName} · ${s.subtitle}`;
  $("#guildName").textContent = s.guildName;
  $("#subtitle").textContent = s.subtitle;

  $("#chips").replaceChildren(
    h("span", { class: "chip" }, "Dönem: ", h("b", {}, periodName(p.start)), " · Başlangıç: ", fmtDate(p.start)),
    h("span", { class: "chip" }, "Haftalık Vergi: ", h("b", {}, p.weeklyTax || "Belirlenmedi"))
  );

  $("#topActions").replaceChildren(
    isAdmin()
      ? h("button", { class: "btn", onclick: logout }, "🔓 Yönetici · Çıkış")
      : h("button", { class: "btn", onclick: openLogin }, "🔒 Yönetici Girişi")
  );

  $("#banner").replaceChildren(
    demo ? h("div", { class: "banner" }, "Demo verisi gösteriliyor: sunucu bağlantısı yok. Netlify'a yüklenince gerçek liste burada görünür.") : null
  );

  const total = members.length;
  const paid = members.filter((m) => m.status === "paid").length;
  const rate = total ? Math.round((paid / total) * 100) : 0;
  $("#stats").replaceChildren(
    statCard("Toplam üye", total),
    statCard("Vergi ödeyen", paid, "green"),
    statCard("Ödemeyen", total - paid, "red"),
    statCard("Tahsilat oranı", "%" + rate, "", rate)
  );

  $("#adminTools").replaceChildren(
    ...(isAdmin() ? [
      h("button", { class: "btn", onclick: () => editMember() }, "＋ Üye ekle"),
      h("button", { class: "btn", onclick: openSettings }, "⚙ Ayarlar"),
      h("button", { class: "btn danger", onclick: newPeriod }, "↻ Yeni dönem")
    ] : [])
  );
  $("#thAct").hidden = !isAdmin();
  renderRows();
}

function renderRows() {
  document.querySelectorAll(".pill").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
  const q = query.trim().toLocaleLowerCase("tr");
  const cols = isAdmin() ? 7 : 6;
  const rows = state.members
    .filter((m) => {
      if (filter === "unpaid" && m.status === "paid") return false;
      if (filter === "paid" && m.status !== "paid") return false;
      if (!q) return true;
      return [m.nick, m.owner, m.discord].some((v) => (v || "").toLocaleLowerCase("tr").includes(q));
    })
    .sort((a, b) => a.nick.localeCompare(b.nick, "tr", { sensitivity: "base" }));

  if (!rows.length) {
    const msg = state.members.length
      ? "Aramana uyan kayıt yok."
      : "Henüz kimse kayıt olmadı. Discord'daki kayıt odasından kayıt olan üyeler burada görünecek.";
    $("#rows").replaceChildren(h("tr", {}, h("td", { class: "empty-row", colspan: cols }, msg)));
    return;
  }

  $("#rows").replaceChildren(...rows.map((m) =>
    h("tr", {},
      h("td", { class: "nick" }, m.nick),
      h("td", {}, h("span", { class: "tag" + (m.class ? "" : " empty") }, m.class || "—")),
      h("td", { class: "owner" }, m.owner || "—"),
      h("td", {}, badge(m.status)),
      h("td", { class: "date" }, fmtDate(m.lastPaid)),
      h("td", { class: "note" }, m.note || "—"),
      isAdmin() ? h("td", { class: "acts" },
        m.status === "paid"
          ? h("button", { class: "icon", title: "Ödenmedi yap", "aria-label": "Ödenmedi yap", onclick: () => setStatus(m, "unpaid") }, "↺")
          : h("button", { class: "icon ok", title: "Ödendi işaretle", "aria-label": "Ödendi işaretle", onclick: () => setStatus(m, "paid") }, "✓"),
        h("button", { class: "icon", title: "Düzenle", "aria-label": "Düzenle", onclick: () => editMember(m) }, "✎"),
        h("button", { class: "icon", title: "Sil", "aria-label": "Sil", onclick: () => removeMember(m) }, "🗑")
      ) : null
    )
  ));
}

/* ---------- modal helpers ---------- */
function openModal({ title, intro, fields = [], submit = "Kaydet", danger, onSubmit }) {
  const form = h("form", { class: "form" });
  const inputs = {};
  for (const f of fields) {
    const input = h("input", {
      type: f.type || "text", name: f.name, value: f.value || "", placeholder: f.placeholder || "",
      maxlength: f.max || 60, autocomplete: "off", required: f.required ? "" : null
    });
    inputs[f.name] = input;
    form.append(h("label", { class: "field" }, h("span", {}, f.label), input));
  }
  const err = h("div", { class: "err", role: "alert" });
  const ok = h("button", { type: "submit", class: "btn " + (danger ? "danger" : "primary") }, submit);
  form.append(err, h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: close }, "Vazgeç"), ok));

  const overlay = h("div", { class: "modal", onclick: (e) => { if (e.target === overlay) close(); } },
    h("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": title },
      h("h2", {}, title), intro ? h("p", { class: "intro" }, intro) : null, form));

  function close() { overlay.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    ok.disabled = true; err.textContent = "";
    try {
      const vals = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value]));
      await onSubmit(vals);
      close();
    } catch (ex) {
      err.textContent = ex.message || "Bir hata oluştu";
      ok.disabled = false;
    }
  });

  $("#modalRoot").append(overlay);
  (Object.values(inputs)[0] || ok).focus();
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- admin actions ---------- */
function openLogin() {
  if (demo) return toast("Demo modunda giriş yapılamaz.");
  openModal({
    title: "Yönetici girişi",
    fields: [{ name: "password", label: "Şifre", type: "password", max: 100, required: true }],
    submit: "Giriş yap",
    onSubmit: async (v) => {
      const r = await api("login", { password: v.password });
      token = r.token; store.set(token);
      toast("Giriş yapıldı");
      render();
    }
  });
}

function logout() { token = null; store.set(null); render(); }

async function apply(action, payload) {
  const r = await api(action, payload);
  state = r.state;
  render();
}

async function setStatus(m, status) {
  try { await apply("setStatus", { id: m.id, status }); }
  catch (e) { toast(e.message); }
}

function editMember(m) {
  openModal({
    title: m ? "Üyeyi düzenle" : "Üye ekle",
    fields: [
      { name: "nick", label: "Karakter adı", value: m?.nick, required: true, max: 30 },
      { name: "class", label: "Sınıf", value: m?.class, max: 30 },
      { name: "owner", label: "Sahip", value: m?.owner, max: 40 },
      { name: "discord", label: "Discord", value: m?.discord, max: 40 },
      { name: "note", label: "Not", value: m?.note, max: 200 }
    ],
    onSubmit: (v) => apply("saveMember", { id: m?.id, ...v })
  });
}

function removeMember(m) {
  openModal({
    title: "Üyeyi sil",
    intro: `${m.nick} listeden kalıcı olarak silinecek.`,
    submit: "Sil", danger: true,
    onSubmit: () => apply("deleteMember", { id: m.id })
  });
}

function openSettings() {
  openModal({
    title: "Ayarlar",
    fields: [
      { name: "guildName", label: "Lonca adı", value: state.settings.guildName, required: true, max: 40 },
      { name: "subtitle", label: "Alt başlık", value: state.settings.subtitle, max: 60 },
      { name: "weeklyTax", label: "Haftalık vergi (ör. 100 adet cevher)", value: state.period.weeklyTax, max: 40 }
    ],
    onSubmit: (v) => apply("saveSettings", v)
  });
}

function newPeriod() {
  openModal({
    title: "Yeni dönem başlat",
    intro: "Dönem bugünden başlar ve herkes 'Ödenmedi' durumuna döner. Son ödeme tarihleri korunur.",
    submit: "Yeni dönemi başlat", danger: true,
    onSubmit: () => apply("newPeriod")
  });
}

/* ---------- wiring ---------- */
$("#q").addEventListener("input", (e) => { query = e.target.value; renderRows(); });
document.querySelectorAll(".pill").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; renderRows(); }));

load();
setInterval(() => { if (!document.hidden && !$(".modal")) load(); }, 30000);
</script>
</body>
</html>
